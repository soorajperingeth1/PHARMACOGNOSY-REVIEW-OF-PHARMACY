            color: var(--text-color);

            padding: 2rem 1rem;
        }

        h1 {

            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

            text-align: center;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .search-container {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        #search-input {
            width: 100%;
            max-width: 500px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            outline: none;
            box-sizing: border-box;
        }

        #search-input:focus {

        }

        .qa-card {

            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        .question {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .answer-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .answer-btn:hover {

        }

        .answer {
            display: none;
            margin-top: 0.75rem;
            padding: 0.75rem 1rem;
            background-color: var(--answer-bg);
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 500;
        }

        .answer.show {
            display: block;
        }

        .no-results {
            text-align: center;
            color: #64748b;
            margin-top: 2rem;
            display: none;
        }

        const container = document.getElementById('quiz-container');
        const noResults = document.getElementById('no-results');

        function renderQuestions(items) {
            container.innerHTML = '';
            if (items.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'qa-card';
                card.innerHTML = `
                    <div class="question">Q${item.originalIndex}: ${item.q}</div>
                    <button class="answer-btn" onclick="toggleAnswer(this)">Show Answer</button>
                    <div class="answer">${item.a}</div>
                `;
                container.appendChild(card);
            });
        }

        // Attach original index for consistent numbering
        const indexedData = qaData.map((item, index) => ({
            ...item,
            originalIndex: index + 1
        }));

        renderQuestions(indexedData);

        function toggleAnswer(button) {
            const answerDiv = button.nextElementSibling;
            const isShown = answerDiv.classList.toggle('show');
            button.textContent = isShown ? 'Hide Answer' : 'Show Answer';
        }

        function filterQuestions() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = indexedData.filter(item => 
                item.q.toLowerCase().includes(query) || 
                item.a.toLowerCase().includes(query)
            );
            renderQuestions(filtered);
        }
